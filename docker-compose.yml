services:
  platform:
    build: ./platform
    ports:
      - "3000:3000"
    volumes:
      - ./platform:/app
      - /app/node_modules
      - /app/.next

  api:
    build: ./api
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    restart: unless-stopped

  stage7:
    build: ./stage7
    ports:
      - "2222:22"
    restart: unless-stopped
